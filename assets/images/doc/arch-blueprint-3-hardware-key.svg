<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 940" width="1600" height="940" style="background:#0a0c10;font-family:'Pretendard','Noto Sans KR','Malgun Gothic',-apple-system,BlinkMacSystemFont,sans-serif;">
  <defs>
    <linearGradient id="bgStudio3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090b10"/>
      <stop offset="50%" stop-color="#10141d"/>
      <stop offset="100%" stop-color="#080a0e"/>
    </linearGradient>
    <radialGradient id="centerGlow3" cx="50%" cy="45%" r="56%">
      <stop offset="0%" stop-color="#1e2636" stop-opacity="0.35"/>
      <stop offset="65%" stop-color="#121722" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#090b10" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panelGunmetal3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#151922"/>
      <stop offset="100%" stop-color="#0e1118"/>
    </linearGradient>
    <linearGradient id="headerBand3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1b212d"/>
      <stop offset="50%" stop-color="#212836"/>
      <stop offset="100%" stop-color="#181e29"/>
    </linearGradient>
    <linearGradient id="cardMatte3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#191e29"/>
      <stop offset="100%" stop-color="#12161f"/>
    </linearGradient>
    <linearGradient id="cardGold3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#211c13"/>
      <stop offset="100%" stop-color="#15120d"/>
    </linearGradient>
    <linearGradient id="cardSage3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#132020"/>
      <stop offset="100%" stop-color="#0d1617"/>
    </linearGradient>
    <filter id="softShadow3" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <pattern id="dotGrid3" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="0.65" fill="#94a3b8" fill-opacity="0.1"/>
    </pattern>
    <marker id="arrSteel3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.8 L 8.5 5 L 0 8.2 z" fill="#7b9ec4"/>
    </marker>
    <marker id="arrSage3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.8 L 8.5 5 L 0 8.2 z" fill="#68b0a0"/>
    </marker>
    <g id="vecLock3">
      <rect x="2" y="9" width="14" height="11" rx="2.5" fill="none" stroke="#dfc184" stroke-width="1.8"/>
      <path d="M 5 9 V 6 A 4 4 0 0 1 13 6 V 9" fill="none" stroke="#dfc184" stroke-width="1.8"/>
    </g>
    <g id="vecBolt3">
      <path d="M 11 2 L 4 11 H 10 L 8 19 L 16 9 H 10 Z" fill="none" stroke="#8fb1d6" stroke-width="1.8" stroke-linejoin="round"/>
    </g>
    <g id="vecLedger3">
      <rect x="3" y="2" width="14" height="18" rx="2" fill="none" stroke="#88d4c3" stroke-width="1.8"/>
      <line x1="6" y1="7" x2="14" y2="7" stroke="#88d4c3" stroke-width="1.5"/>
      <line x1="6" y1="11" x2="14" y2="11" stroke="#88d4c3" stroke-width="1.5"/>
      <line x1="6" y1="15" x2="11" y2="15" stroke="#88d4c3" stroke-width="1.5"/>
    </g>
  </defs>

  <rect width="1600" height="940" fill="url(#bgStudio3)"/>
  <rect width="1600" height="940" fill="url(#centerGlow3)"/>
  <rect width="1600" height="940" fill="url(#dotGrid3)"/>
  <rect x="18" y="16" width="1564" height="908" rx="14" fill="#0c0f15" fill-opacity="0.7" stroke="#262d3b" stroke-width="1.2"/>

  <!-- Top Header Banner -->
  <g filter="url(#softShadow3)">
    <rect x="32" y="28" width="1536" height="72" rx="10" fill="url(#panelGunmetal3)" stroke="#2b3343" stroke-width="1"/>
  </g>
  <circle cx="56" cy="51" r="4.5" fill="#7b9ec4"/>
  <text x="70" y="55" fill="#94a3b8" font-size="11.5" font-weight="700" letter-spacing="1.8">AXIDE SOVEREIGN AI · ARCHITECTURE BLUEPRINT 03 / 04</text>
  <text x="52" y="82" fill="#f1f5f9" font-size="20" font-weight="800">도면은 공장 열쇠로만 열립니다 — 하드웨어 키(HSM) 귀속 암호화 &amp; 폐쇄망 RAM 인메모리 해독·즉시 소거</text>
  <rect x="1220" y="44" width="330" height="40" rx="7" fill="#10141c" stroke="#4a3d24" stroke-width="1"/>
  <text x="1385" y="69" fill="#dfc184" font-size="12.5" font-weight="700" text-anchor="middle">자물쇠는 원청에 · 물리 열쇠는 공장에</text>

  <!-- ==================== STAGE 1: PRIME CONTRACTOR ==================== -->
  <g filter="url(#softShadow3)">
    <rect x="32" y="114" width="486" height="546" rx="10" fill="url(#panelGunmetal3)" stroke="#2b3343" stroke-width="1.1"/>
    <path d="M 32 124 A 10 10 0 0 1 42 114 H 508 A 10 10 0 0 1 518 124 V 162 H 32 Z" fill="url(#headerBand3)"/>
    <line x1="32" y1="162" x2="518" y2="162" stroke="#2b3343" stroke-width="1"/>
  </g>
  <text x="275" y="144" fill="#f1f5f9" font-size="16.5" font-weight="800" text-anchor="middle">STAGE 1 · 원청 (지정 공장 공개키로 도면 봉인)</text>

  <g transform="translate(54, 182)">
    <rect width="442" height="144" rx="8" fill="url(#cardMatte3)" stroke="#2b3343" stroke-width="1"/>
    <rect x="18" y="18" width="38" height="38" rx="7" fill="#141b26" stroke="#475b78" stroke-width="1"/>
    <text x="37" y="43" fill="#8fb1d6" font-size="15" font-weight="800" text-anchor="middle">①</text>
    <text x="70" y="34" fill="#8fb1d6" font-size="15" font-weight="800">공장이 사전에 등록한 ‘열린 자물쇠(공개키)’</text>
    <text x="70" y="56" fill="#f1f5f9" font-size="13" font-weight="700">원청 발주 시스템에 협력사 서버 고유 공개키 등록</text>
    <text x="70" y="82" fill="#cbd5e1" font-size="12">• 각 협력사 공장 서버의 물리 보안 동글(HSM)마다 고유 키 쌍 생성</text>
    <text x="70" y="104" fill="#cbd5e1" font-size="12">• 공개키(자물쇠)만 원청에 등록되고, 개인키(열쇠)는 공장 밖 반출 불가</text>
    <text x="70" y="126" fill="#7b9ec4" font-size="11" font-weight="600">Algorithm: Ed25519 / X25519 + AES-256-GCM Hardware Binding</text>
  </g>

  <g transform="translate(54, 344)">
    <rect width="442" height="156" rx="8" fill="url(#cardGold3)" stroke="#6e582c" stroke-width="1"/>
    <rect x="18" y="18" width="38" height="38" rx="7" fill="#211b11" stroke="#856a35" stroke-width="1"/>
    <text x="37" y="43" fill="#dfc184" font-size="15" font-weight="800" text-anchor="middle">②</text>
    <text x="70" y="34" fill="#dfc184" font-size="15" font-weight="800">원청은 ‘봉인 전송’ 버튼 한 번으로 잠그고 전달</text>
    <text x="70" y="56" fill="#f1f5f9" font-size="13" font-weight="700">복잡한 암호 설정 없이 원클릭 자동 암호화 패키징</text>
    <text x="70" y="82" fill="#cbd5e1" font-size="12">• STEP · DWG · PDF 도면 원본과 작업지시서를 즉시 암호화(.axvault)</text>
    <text x="70" y="104" fill="#cbd5e1" font-size="12">• 도면 원본의 SHA-256 지문(Hash)과 원청 전자서명을 헤더에 결합</text>
    <rect x="70" y="116" width="352" height="26" rx="5" fill="#14110b" stroke="#5e4b25" stroke-width="1"/>
    <text x="246" y="133.5" fill="#dfc184" font-size="11" font-weight="700" text-anchor="middle">지정된 협력사 공장 서버 외에는 전 세계 어디서도 열람 불가</text>
  </g>

  <rect x="54" y="518" width="442" height="122" rx="8" fill="#10141c" stroke="#2b3343" stroke-width="1"/>
  <text x="275" y="546" fill="#8fb1d6" font-size="13.5" font-weight="800" text-anchor="middle">원청 보안 담당자 이점 (Prime Contractor Benefit)</text>
  <text x="74" y="574" fill="#cbd5e1" font-size="12">✓ 협력사 이메일 오발송·외부 웹하드 해킹 시에도 도면 유출 피해 0%</text>
  <text x="74" y="598" fill="#cbd5e1" font-size="12">✓ 2차·3차 협력사로의 무단 재하청 도면 전달 원천 차단</text>
  <text x="74" y="622" fill="#88d4c3" font-size="12" font-weight="700">✓ 방위산업기술 보호법상 ‘합리적 보호조치 이행’ 완벽 입증</text>

  <line x1="518" y1="380" x2="552" y2="380" stroke="#7b9ec4" stroke-width="2.5" marker-end="url(#arrSteel3)"/>

  <!-- ==================== STAGE 2: TRANSIT & OFFICE PC ==================== -->
  <g filter="url(#softShadow3)">
    <rect x="556" y="114" width="488" height="546" rx="10" fill="url(#panelGunmetal3)" stroke="#2b3343" stroke-width="1.1"/>
    <path d="M 556 124 A 10 10 0 0 1 566 114 H 1034 A 10 10 0 0 1 1044 124 V 162 H 556 Z" fill="url(#headerBand3)"/>
    <line x1="556" y1="162" x2="1044" y2="162" stroke="#2b3343" stroke-width="1"/>
  </g>
  <text x="800" y="144" fill="#f1f5f9" font-size="16.5" font-weight="800" text-anchor="middle">STAGE 2 · 메일 · 사무실 구간 (중간 탈취 완전 무력화)</text>

  <g transform="translate(578, 182)">
    <rect width="444" height="156" rx="8" fill="url(#cardMatte3)" stroke="#3b465c" stroke-width="1"/>
    <rect x="18" y="18" width="38" height="38" rx="7" fill="#181f2c" stroke="#475b78" stroke-width="1"/>
    <text x="37" y="43" fill="#cbd5e1" font-size="15" font-weight="800" text-anchor="middle">③</text>
    <text x="70" y="34" fill="#f1f5f9" font-size="15" font-weight="800">중간에서는 아무도 못 엶 (암호문 상태 유지)</text>
    <text x="70" y="56" fill="#cbd5e1" font-size="13" font-weight="700">이메일 서버 · 사무실 인터넷 PC · 이동 구간 열람 불가</text>
    <text x="70" y="82" fill="#94a3b8" font-size="12">• 사무실 인터넷 PC에서 파일을 더블클릭해도 열쇠(동글)가 없어 차단</text>
    <text x="70" y="104" fill="#94a3b8" font-size="12">• 외부 해커가 네트워크 패킷이나 메일함을 탈취해도 해독 불가능</text>
    <rect x="70" y="116" width="352" height="26" rx="5" fill="#10141c" stroke="#333e52" stroke-width="1"/>
    <text x="246" y="133.5" fill="#cbd5e1" font-size="11" font-weight="700" text-anchor="middle">물리적 HSM 개인키 미보유 시 복호화 연산 원천 거부</text>
  </g>

  <g transform="translate(578, 356)">
    <rect width="444" height="144" rx="8" fill="url(#cardMatte3)" stroke="#2b3343" stroke-width="1"/>
    <rect x="18" y="18" width="38" height="38" rx="7" fill="#141b26" stroke="#475b78" stroke-width="1"/>
    <text x="37" y="43" fill="#8fb1d6" font-size="15" font-weight="800" text-anchor="middle">⑤</text>
    <text x="70" y="34" fill="#8fb1d6" font-size="15" font-weight="800">검역 통과 후 반입 &amp; 사무실 사본 즉시 삭제</text>
    <text x="70" y="56" fill="#f1f5f9" font-size="13" font-weight="700">공장 반입과 동시에 외부 접점 흔적 완전 제거</text>
    <text x="70" y="82" fill="#cbd5e1" font-size="12">• ⑤ 원청 서명 진위 확인 및 악성코드 정밀 검역 통과</text>
    <text x="70" y="104" fill="#cbd5e1" font-size="12">• ⑥ 푸른 단방향 게이트로 반입 완료 즉시 사무실 PC 사본 영구 파기</text>
    <text x="70" y="126" fill="#88d4c3" font-size="11.5" font-weight="700">✓ 인터넷 연결 PC에는 암호화된 임시 파일조차 남지 않음</text>
  </g>

  <rect x="578" y="518" width="444" height="122" rx="8" fill="#10141c" stroke="#2b3343" stroke-width="1"/>
  <text x="800" y="546" fill="#e2e8f0" font-size="13.5" font-weight="800" text-anchor="middle">기존 수기/이메일 방식 vs AXIDE 하드웨어 키 봉인</text>
  <text x="598" y="574" fill="#94a3b8" font-size="12">• 기존 방식: 일반 PDF/DWG 첨부 발송 → 사무실 PC 해킹 시 즉시 유출</text>
  <text x="598" y="598" fill="#f1f5f9" font-size="12" font-weight="700">• AXIDE 방식: 공장 서버 HSM 동글 결합 없이는 파일 열람 자체 불가</text>
  <text x="598" y="622" fill="#88d4c3" font-size="12" font-weight="700">→ “파일이 지나가는 길(네트워크)이 털려도 도면 기밀은 100% 안전”</text>

  <line x1="1044" y1="380" x2="1078" y2="380" stroke="#68b0a0" stroke-width="2.5" marker-end="url(#arrSage3)"/>

  <!-- ==================== STAGE 3: AIR-GAPPED FACTORY SERVER ==================== -->
  <g filter="url(#softShadow3)">
    <rect x="1082" y="114" width="486" height="546" rx="10" fill="url(#panelGunmetal3)" stroke="#3b6960" stroke-width="1.2"/>
    <path d="M 1082 124 A 10 10 0 0 1 1092 114 H 1558 A 10 10 0 0 1 1568 124 V 162 H 1082 Z" fill="#162625"/>
    <line x1="1082" y1="162" x2="1568" y2="162" stroke="#3b6960" stroke-width="1"/>
  </g>
  <text x="1325" y="144" fill="#88d4c3" font-size="16.5" font-weight="800" text-anchor="middle">STAGE 3 · 공장 폐쇄망 서버 (인메모리 해독 · 소거)</text>

  <g transform="translate(1104, 182)">
    <rect width="442" height="162" rx="8" fill="url(#cardSage3)" stroke="#487a70" stroke-width="1"/>
    <rect x="18" y="18" width="38" height="38" rx="7" fill="#122422" stroke="#487a70" stroke-width="1"/>
    <text x="37" y="43" fill="#88d4c3" font-size="15" font-weight="800" text-anchor="middle">④</text>
    <text x="70" y="34" fill="#88d4c3" font-size="15" font-weight="800">공장 서버에서만 열림 &amp; 작업 후 메모리 즉시 소거</text>
    <text x="70" y="56" fill="#f1f5f9" font-size="13" font-weight="700">물리 보안 동글(HSM) 결합 + 디스크 평문 저장 0 Byte</text>
    <text x="70" y="82" fill="#cbd5e1" font-size="12">• 서버에 꽂힌 물리 보안 동글(열쇠)과 마더보드 ID가 일치해야 복호화</text>
    <text x="70" y="104" fill="#cbd5e1" font-size="12">• 디스크(SSD)에 평문 도면을 쓰지 않고 GPU/RAM 메모리 위에서만 처리</text>
    <rect x="70" y="118" width="352" height="28" rx="5" fill="#0d1716" stroke="#3b6960" stroke-width="1"/>
    <text x="246" y="136.5" fill="#88d4c3" font-size="11" font-weight="700" text-anchor="middle">가공·검수 완료 즉시 RAM 제로화(Zero-ization) 완전 휘발</text>
  </g>

  <g transform="translate(1104, 362)">
    <rect width="442" height="138" rx="8" fill="url(#cardGold3)" stroke="#6e582c" stroke-width="1"/>
    <rect x="18" y="18" width="38" height="38" rx="7" fill="#211b11" stroke="#856a35" stroke-width="1"/>
    <text x="37" y="43" fill="#dfc184" font-size="15" font-weight="800" text-anchor="middle">⑦</text>
    <text x="70" y="34" fill="#dfc184" font-size="15" font-weight="800">열람 · 가공 · 소거 전 과정 SHA-256 감사 기록</text>
    <text x="70" y="56" fill="#f1f5f9" font-size="13" font-weight="700">“몇 시에 열어서 어떤 부품을 가공하고 지웠는지” 영구 봉인</text>
    <text x="70" y="82" fill="#cbd5e1" font-size="12">• 도면 복호화 시각 · 작업자 승인 · CNC 가공 로그 · RAM 소거 시각 기록</text>
    <text x="70" y="104" fill="#cbd5e1" font-size="12">• 부품 여권(Part Passport)에 보안 감사 증적이 함께 묶여 원청에 증명됨</text>
  </g>

  <rect x="1104" y="518" width="442" height="122" rx="8" fill="#10141c" stroke="#2e524b" stroke-width="1"/>
  <text x="1325" y="546" fill="#88d4c3" font-size="13.5" font-weight="800" text-anchor="middle">물리적 하드웨어 귀속 (Hardware Root of Trust)</text>
  <text x="1124" y="574" fill="#cbd5e1" font-size="12">• USB 보안 동글 분실·탈취 시에도 지정 공장 서버 본체 없이는 작동 불가</text>
  <text x="1124" y="598" fill="#cbd5e1" font-size="12">• 비인가 USB 연결 또는 케이스 개방 감지 시 복호화 세션 즉시 잠금</text>
  <text x="1124" y="622" fill="#88d4c3" font-size="12" font-weight="700">• 오프라인 1회용 활성화 코드 및 분기별 서명 검증 모듈 업데이트 지원</text>

  <!-- ==================== 3 PILLAR SUMMARY CARDS AT BOTTOM ==================== -->
  <g transform="translate(32, 680)">
    <rect width="486" height="168" rx="10" fill="url(#cardGold3)" stroke="#6e582c" stroke-width="1.1"/>
    <rect x="24" y="24" width="52" height="52" rx="10" fill="#211b11" stroke="#856a35" stroke-width="1"/>
    <use href="#vecLock3" x="41" y="39"/>
    <text x="94" y="46" fill="#dfc184" font-size="17" font-weight="800">자물쇠는 원청에, 열쇠는 공장에</text>
    <text x="94" y="76" fill="#cbd5e1" font-size="13">원청은 공장의 공개키(열린 자물쇠)로 도면을 잠그고,</text>
    <text x="94" y="100" fill="#cbd5e1" font-size="13">오직 공장 서버 내부의 물리 보안 동글(열쇠)만이</text>
    <text x="94" y="124" fill="#dfc184" font-size="13" font-weight="700">폐쇄망 메모리 위에서 도면을 해독할 수 있습니다.</text>
  </g>

  <g transform="translate(556, 680)">
    <rect width="488" height="168" rx="10" fill="url(#cardMatte3)" stroke="#3b4f6b" stroke-width="1.1"/>
    <rect x="24" y="24" width="52" height="52" rx="10" fill="#141b26" stroke="#475b78" stroke-width="1"/>
    <use href="#vecBolt3" x="40" y="39"/>
    <text x="94" y="46" fill="#8fb1d6" font-size="17" font-weight="800">원청 할 일은 ‘봉인 전송’ 버튼 한 번</text>
    <text x="94" y="76" fill="#cbd5e1" font-size="13">복잡한 보안 프로그램 설치나 암호 교환 절차 없이,</text>
    <text x="94" y="100" fill="#cbd5e1" font-size="13">발주 화면에서 ‘봉인 전송’ 한 번이면 협력사 전용 암호화</text>
    <text x="94" y="124" fill="#8fb1d6" font-size="13" font-weight="700">패키지가 생성되어 전달 구간 탈취를 원천 무력화합니다.</text>
  </g>

  <g transform="translate(1082, 680)">
    <rect width="486" height="168" rx="10" fill="url(#cardSage3)" stroke="#487a70" stroke-width="1.1"/>
    <rect x="24" y="24" width="52" height="52" rx="10" fill="#122422" stroke="#487a70" stroke-width="1"/>
    <use href="#vecLedger3" x="40" y="39"/>
    <text x="94" y="46" fill="#88d4c3" font-size="17" font-weight="800">안 남기고 지우되, 기록은 영구히 남는다</text>
    <text x="94" y="76" fill="#cbd5e1" font-size="13">가공이 끝나면 메모리(RAM) 속 평문 도면은 즉시 소거되어</text>
    <text x="94" y="100" fill="#cbd5e1" font-size="13">파일 흔적이 남지 않지만, 열람·가공·소거 감사 로그는</text>
    <text x="94" y="124" fill="#88d4c3" font-size="13" font-weight="700">SHA-256 해시 체인에 영구 보존되어 결백을 증명합니다.</text>
  </g>

