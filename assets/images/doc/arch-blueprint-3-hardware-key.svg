  <text x="74" y="57" fill="#38bdf8" font-size="13" font-weight="800" letter-spacing="1.5">AXIDE SOVEREIGN AI · ARCHITECTURE BLUEPRINT 03 / 04</text>
  <text x="52" y="82" fill="#f8fafc" font-size="21" font-weight="800">도면은 공장 열쇠로만 열립니다 — 하드웨어 키(HSM) 귀속 암호화 &amp; 폐쇄망 RAM 인메모리 해독·즉시 소거</text>
