  <text x="275" y="146" fill="#ffffff" font-size="18" font-weight="800" text-anchor="middle">STAGE 1 · 원청 (지정 공장 공개키로 도면 봉인)</text>

  <!-- Step 1 Card -->
  <g transform="translate(54, 186)">
    <rect width="442" height="142" rx="12" fill="#091426" stroke="#38bdf8" stroke-opacity="0.45"/>
    <rect x="18" y="18" width="40" height="40" rx="8" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8"/>
    <text x="38" y="44" fill="#38bdf8" font-size="16" font-weight="800" text-anchor="middle">①</text>
    <text x="72" y="34" fill="#38bdf8" font-size="15.5" font-weight="800">공장이 사전에 등록한 ‘열린 자물쇠(공개키)’</text>
    <text x="72" y="56" fill="#ffffff" font-size="13.5" font-weight="700">원청 발주 시스템에 협력사 서버 고유 공개키 등록</text>
    <text x="72" y="82" fill="#cbd5e1" font-size="12.5">• 각 협력사 공장 서버의 물리 보안 동글(HSM)마다 고유 키 쌍 생성</text>
    <text x="72" y="104" fill="#cbd5e1" font-size="12.5">• 공개키(자물쇠)만 원청에 등록되고, 개인키(열쇠)는 공장 밖 반출 불가</text>
    <text x="72" y="126" fill="#7dd3fc" font-size="11.5" font-weight="700">Algorithm: Ed25519 / X25519 + AES-256-GCM Hardware Binding</text>
  </g>

  <!-- Step 2 Card -->
  <g transform="translate(54, 346)">
    <rect width="442" height="154" rx="12" fill="#091426" stroke="#f59e0b" stroke-opacity="0.55"/>
    <rect x="18" y="18" width="40" height="40" rx="8" fill="#d97706" fill-opacity="0.3" stroke="#f59e0b"/>
    <text x="38" y="44" fill="#fbbf24" font-size="16" font-weight="800" text-anchor="middle">②</text>
    <text x="72" y="34" fill="#fcd34d" font-size="15.5" font-weight="800">원청은 ‘봉인 전송’ 버튼 한 번으로 잠그고 전달</text>
    <text x="72" y="56" fill="#ffffff" font-size="13.5" font-weight="700">복잡한 암호 설정 없이 원클릭 자동 암호화 패키징</text>
    <text x="72" y="82" fill="#cbd5e1" font-size="12.5">• STEP · DWG · PDF 도면 원본과 작업지시서를 즉시 암호화(.axvault)</text>
    <text x="72" y="104" fill="#cbd5e1" font-size="12.5">• 도면 원본의 SHA-256 지문(Hash)과 원청 전자서명을 헤더에 결합</text>
    <rect x="72" y="116" width="350" height="26" rx="6" fill="#271b09" stroke="#f59e0b" stroke-opacity="0.5"/>
    <text x="247" y="134" fill="#fcd34d" font-size="11.5" font-weight="800" text-anchor="middle">🔒 지정된 협력사 공장 서버 외에는 전 세계 어디서도 열람 불가</text>
  </g>

  <!-- Bottom note inside Stage 1 -->
  <rect x="54" y="518" width="442" height="120" rx="12" fill="#06101e" stroke="#38bdf8" stroke-opacity="0.35"/>
  <text x="275" y="548" fill="#7dd3fc" font-size="14" font-weight="800" text-anchor="middle">원청 보안 담당자 이점 (Prime Contractor Benefit)</text>
  <text x="74" y="576" fill="#cbd5e1" font-size="12.5">✓ 협력사 이메일 오발송·외부 웹하드 해킹 시에도 도면 유출 피해 0%</text>
  <text x="74" y="600" fill="#cbd5e1" font-size="12.5">✓ 2차·3차 협력사로의 무단 재하청 도면 전달 원천 차단</text>
  <text x="74" y="624" fill="#6ee7b7" font-size="12.5" font-weight="700">✓ 방위산업기술 보호법상 ‘합리적 보호조치 이행’ 완벽 입증</text>

