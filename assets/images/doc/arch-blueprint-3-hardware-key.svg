    <text x="72" y="56" fill="#ffffff" font-size="13.5" font-weight="700">공장 반입과 동시에 외부 접점 흔적 완전 제거</text>
    <text x="72" y="82" fill="#cbd5e1" font-size="12.5">• ⑤ 원청 서명 진위 확인 및 악성코드 정밀 검역 통과</text>
    <text x="72" y="104" fill="#cbd5e1" font-size="12.5">• ⑥ 푸른 단방향 게이트로 반입 완료 즉시 사무실 PC 사본 영구 파기</text>
    <text x="72" y="126" fill="#6ee7b7" font-size="11.5" font-weight="700">✓ 인터넷 연결 PC에는 암호화된 임시 파일조차 남지 않음</text>
