    <rect x="18" y="18" width="40" height="40" rx="8" fill="#059669" fill-opacity="0.3" stroke="#10b981"/>
    <text x="38" y="44" fill="#34d399" font-size="16" font-weight="800" text-anchor="middle">④</text>
    <text x="72" y="34" fill="#34d399" font-size="15.5" font-weight="800">공장 서버에서만 열림 &amp; 작업 후 메모리 즉시 소거</text>
    <text x="72" y="56" fill="#ffffff" font-size="13.5" font-weight="700">물리 보안 동글(HSM) 결합 + 디스크 평문 저장 0 Byte</text>
    <text x="72" y="82" fill="#cbd5e1" font-size="12.5">• 서버에 꽂힌 물리 보안 동글(열쇠)과 마더보드 ID가 일치해야 복호화</text>
    <text x="72" y="104" fill="#cbd5e1" font-size="12.5">• 디스크(SSD)에 평문 도면을 쓰지 않고 GPU/RAM 메모리 위에서만 처리</text>
    <rect x="72" y="118" width="350" height="28" rx="6" fill="#042f2e" stroke="#10b981" stroke-opacity="0.7"/>
    <text x="247" y="137" fill="#6ee7b7" font-size="11.5" font-weight="800" text-anchor="middle">⚡ 가공·검수 완료 즉시 RAM 제로화(Zero-ization) 완전 휘발</text>
  </g>

  <!-- Step 7 Card -->
  <g transform="translate(1104, 366)">
    <rect width="442" height="134" rx="12" fill="#091426" stroke="#f59e0b" stroke-opacity="0.55"/>
    <rect x="18" y="18" width="40" height="40" rx="8" fill="#d97706" fill-opacity="0.3" stroke="#f59e0b"/>
    <text x="38" y="44" fill="#fbbf24" font-size="16" font-weight="800" text-anchor="middle">⑦</text>
    <text x="72" y="34" fill="#fcd34d" font-size="15.5" font-weight="800">열람 · 가공 · 소거 전 과정 SHA-256 감사 기록</text>
    <text x="72" y="56" fill="#ffffff" font-size="13.5" font-weight="700">“몇 시에 열어서 어떤 부품을 가공하고 지웠는지” 영구 봉인</text>
    <text x="72" y="82" fill="#cbd5e1" font-size="12.5">• 도면 복호화 시각 · 작업자 승인 · CNC 가공 로그 · RAM 소거 시각 기록</text>
    <text x="72" y="104" fill="#cbd5e1" font-size="12.5">• 부품 여권(Part Passport)에 보안 감사 증적이 함께 묶여 원청에 증명됨</text>
  </g>

  <!-- Hardware Key Spec Box -->
  <rect x="1104" y="518" width="442" height="120" rx="12" fill="#06101e" stroke="#10b981" stroke-opacity="0.5"/>
  <text x="1325" y="548" fill="#34d399" font-size="14" font-weight="800" text-anchor="middle">물리적 하드웨어 귀속 (Hardware Root of Trust)</text>
  <text x="1124" y="576" fill="#cbd5e1" font-size="12.5">• USB 보안 동글 분실·탈취 시에도 지정 공장 서버 본체 없이는 작동 불가</text>
  <text x="1124" y="600" fill="#cbd5e1" font-size="12.5">• 비인가 USB 연결 또는 케이스 개방 감지 시 복호화 세션 즉시 잠금</text>
  <text x="1124" y="624" fill="#6ee7b7" font-size="12.5" font-weight="700">• 오프라인 1회용 활성화 코드 및 분기별 서명 검증 모듈 업데이트 지원</text>

  <!-- ==================== 3 PILLAR SUMMARY CARDS AT BOTTOM ==================== -->
  <g transform="translate(32, 680)">
    <rect width="486" height="150" rx="14" fill="#17120a" stroke="#f59e0b" stroke-opacity="0.65" stroke-width="1.5"/>
    <rect x="24" y="24" width="56" height="56" rx="12" fill="#d97706" fill-opacity="0.25" stroke="#f59e0b"/>
    <text x="52" y="60" fill="#fbbf24" font-size="26" text-anchor="middle">🔒</text>
    <text x="98" y="46" fill="#fcd34d" font-size="18" font-weight="800">자물쇠는 원청에, 열쇠는 공장에</text>
    <text x="98" y="74" fill="#e2e8f0" font-size="13.5">원청은 공장의 공개키(열린 자물쇠)로 도면을 잠그고,</text>
    <text x="98" y="96" fill="#e2e8f0" font-size="13.5">오직 공장 서버 내부의 물리 보안 동글(열쇠)만이</text>
    <text x="98" y="118" fill="#fcd34d" font-size="13.5" font-weight="700">폐쇄망 메모리 위에서 도면을 해독할 수 있습니다.</text>
  </g>

  <g transform="translate(556, 680)">
    <rect width="488" height="150" rx="14" fill="#09182b" stroke="#38bdf8" stroke-opacity="0.65" stroke-width="1.5"/>
    <rect x="24" y="24" width="56" height="56" rx="12" fill="#0284c7" fill-opacity="0.25" stroke="#38bdf8"/>
    <text x="52" y="60" fill="#38bdf8" font-size="26" text-anchor="middle">⚡</text>
    <text x="98" y="46" fill="#38bdf8" font-size="18" font-weight="800">원청 할 일은 ‘봉인 전송’ 버튼 한 번</text>
    <text x="98" y="74" fill="#e2e8f0" font-size="13.5">복잡한 보안 프로그램 설치나 암호 교환 절차 없이,</text>
    <text x="98" y="96" fill="#e2e8f0" font-size="13.5">발주 화면에서 ‘봉인 전송’ 한 번이면 협력사 전용 암호화</text>
    <text x="98" y="118" fill="#7dd3fc" font-size="13.5" font-weight="700">패키지가 생성되어 전달 구간 탈취를 원천 무력화합니다.</text>
  </g>

  <g transform="translate(1082, 680)">
    <rect width="486" height="150" rx="14" fill="#061b15" stroke="#10b981" stroke-opacity="0.65" stroke-width="1.5"/>
    <rect x="24" y="24" width="56" height="56" rx="12" fill="#059669" fill-opacity="0.25" stroke="#10b981"/>
    <text x="52" y="60" fill="#34d399" font-size="26" text-anchor="middle">📜</text>
    <text x="98" y="46" fill="#34d399" font-size="18" font-weight="800">안 남기고 지우되, 기록은 영구히 남는다</text>
    <text x="98" y="74" fill="#e2e8f0" font-size="13.5">가공이 끝나면 메모리(RAM) 속 평문 도면은 즉시 소거되어</text>
    <text x="98" y="96" fill="#e2e8f0" font-size="13.5">파일 흔적이 남지 않지만, 열람·가공·소거 감사 로그는</text>
