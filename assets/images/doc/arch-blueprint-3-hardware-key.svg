  <text x="800" y="548" fill="#fda4af" font-size="14" font-weight="800" text-anchor="middle">기존 수기/이메일 방식 vs AXIDE 하드웨어 키 봉인</text>
  <text x="598" y="576" fill="#94a3b8" font-size="12.5">• 기존 방식: 일반 PDF/DWG 첨부 발송 → 사무실 PC 해킹 시 즉시 유출</text>
  <text x="598" y="600" fill="#ffffff" font-size="12.5" font-weight="700">• AXIDE 방식: 공장 서버 HSM 동글 결합 없이는 파일 열람 자체 불가</text>
