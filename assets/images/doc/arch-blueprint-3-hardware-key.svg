    <text x="72" y="104" fill="#fecdd3" font-size="12.5">• 외부 해커가 네트워크 패킷이나 메일함을 탈취해도 해독 불가능</text>
    <rect x="72" y="116" width="350" height="26" rx="6" fill="#2d0c16" stroke="#f43f5e" stroke-opacity="0.6"/>
