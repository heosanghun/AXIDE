      <stop offset="0%" stop-color="#060a14"/>
      <stop offset="50%" stop-color="#0b1222"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="redAlertGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#450a0a" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0.88"/>
