      <stop offset="0%" stop-color="#050911"/>
      <stop offset="50%" stop-color="#0a1222"/>
      <stop offset="100%" stop-color="#04070e"/>
    </linearGradient>
    <linearGradient id="zoneAirgap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a192f" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#060d1a" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="gateBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#07223b"/>
      <stop offset="100%" stop-color="#0c3559"/>
