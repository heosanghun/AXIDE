<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 920" width="1600" height="920" style="background:#060a12;font-family:'Pretendard','Noto Sans KR','Malgun Gothic',-apple-system,sans-serif;">
  <defs>
