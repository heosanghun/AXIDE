    <linearGradient id="gateGold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2c1d08"/>
      <stop offset="100%" stop-color="#422a09"/>
    </linearGradient>
    <pattern id="cadGrid2" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38bdf8" stroke-width="0.6" stroke-opacity="0.07"/>
    </pattern>
    <marker id="arrBlue2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrGold2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <rect width="1600" height="920" fill="url(#bgGrad2)"/>
  <rect width="1600" height="920" fill="url(#cadGrid2)"/>
  <rect x="16" y="16" width="1568" height="888" rx="18" fill="none" stroke="#38bdf8" stroke-opacity="0.28" stroke-width="1.5"/>

  <!-- Top Header Banner -->
  <rect x="32" y="28" width="1536" height="68" rx="12" fill="#0b1528" stroke="#38bdf8" stroke-opacity="0.35"/>
  <circle cx="58" cy="52" r="6" fill="#f59e0b"/>
  <text x="74" y="57" fill="#fbbf24" font-size="13" font-weight="800" letter-spacing="1.5">AXIDE SOVEREIGN AI · ARCHITECTURE BLUEPRINT 02 / 04</text>
  <text x="52" y="82" fill="#f8fafc" font-size="21" font-weight="800">단방향 이중 게이트 &amp; 에어갭 스마트 팩토리 — “도면은 공장 안에, 부품은 여권을 들고”</text>
  <rect x="1220" y="42" width="330" height="40" rx="8" fill="#060d1a" stroke="#10b981" stroke-opacity="0.5"/>
  <text x="1385" y="67" fill="#34d399" font-size="13" font-weight="800" text-anchor="middle">물리적 망분리 · 도면 외부 유출 0 Byte</text>

  <!-- ==================== LEFT ZONE: AIR-GAPPED FACTORY (공장 폐쇄망 구역) ==================== -->
  <rect x="32" y="114" width="600" height="640" rx="16" fill="url(#zoneAirgap)" stroke="#38bdf8" stroke-opacity="0.65" stroke-width="2"/>
  <rect x="32" y="114" width="600" height="52" rx="16" fill="#0284c7" fill-opacity="0.22"/>
  <text x="332" y="146" fill="#ffffff" font-size="18.5" font-weight="800" text-anchor="middle">🛡️ 공장 내부 폐쇄망 구역 (Air-Gapped Factory · 인터넷 연결 0)</text>

  <!-- Core Server Box -->
  <g transform="translate(56, 184)">
    <rect width="552" height="145" rx="12" fill="#0b192e" stroke="#38bdf8" stroke-opacity="0.55" stroke-width="1.5"/>
    <rect x="18" y="18" width="118" height="108" rx="10" fill="#061020" stroke="#38bdf8" stroke-opacity="0.5"/>
    <text x="77" y="52" fill="#38bdf8" font-size="13" font-weight="800" text-anchor="middle">Cogni-OS</text>
    <text x="77" y="72" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">추론 서버</text>
    <text x="77" y="94" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">RTX 6000 Ada</text>
    <text x="77" y="112" fill="#94a3b8" font-size="10.5" text-anchor="middle">HSM 보안 동글 장착</text>

    <text x="156" y="38" fill="#38bdf8" font-size="15.5" font-weight="800">폐쇄망 로컬 AI 두뇌 (Cogni-OS Appliance Server)</text>
    <text x="156" y="64" fill="#e2e8f0" font-size="13">• 반입된 봉인 도면을 서버 내부 메모리(VRAM/RAM)에서만 해독</text>
    <text x="156" y="88" fill="#e2e8f0" font-size="13">• STEP·DWG 3D 형상 복원 · 공차 추출 · G-code 가공 경로 생성</text>
    <text x="156" y="112" fill="#6ee7b7" font-size="13" font-weight="700">• 가공·측정 완료 후 SHA-256 + Ed25519 부품 여권(QR) 봉인 발급</text>
  </g>

  <!-- 4 Field Devices inside Air-Gapped Factory -->
  <g transform="translate(56, 346)">
    <rect width="266" height="122" rx="10" fill="#091426" stroke="#38bdf8" stroke-opacity="0.4"/>
    <text x="20" y="30" fill="#7dd3fc" font-size="14" font-weight="800">① 현장 엔지니어 노트북</text>
    <text x="20" y="54" fill="#cbd5e1" font-size="12.5">• 3D CAD/CAM 정밀 공정 검토</text>
    <text x="20" y="76" fill="#cbd5e1" font-size="12.5">• 설비 제어 · 출하 사람 승인(🔒)</text>
    <text x="20" y="98" fill="#94a3b8" font-size="11.5">※ 외부 USB 포트 물리 봉인</text>
  </g>
  <g transform="translate(342, 346)">
    <rect width="266" height="122" rx="10" fill="#091426" stroke="#38bdf8" stroke-opacity="0.4"/>
    <text x="20" y="30" fill="#7dd3fc" font-size="14" font-weight="800">② 러기드 태블릿 (탭 S11 울트라)</text>
    <text x="20" y="54" fill="#cbd5e1" font-size="12.5">• 설비 옆 도면 3D 단면 · 공차 확인</text>
    <text x="20" y="76" fill="#cbd5e1" font-size="12.5">• 4R-ATP 치수 측정값 즉시 대조</text>
    <text x="20" y="98" fill="#94a3b8" font-size="11.5">※ 공장 내부 전용 폐쇄 Wi-Fi</text>
  </g>
  <g transform="translate(56, 484)">
    <rect width="266" height="122" rx="10" fill="#091426" stroke="#38bdf8" stroke-opacity="0.4"/>
    <text x="20" y="30" fill="#7dd3fc" font-size="14" font-weight="800">③ AR 스마트글라스 (3줄 HUD)</text>
    <text x="20" y="54" fill="#cbd5e1" font-size="12.5">• 양손 작업 중 핵심 공차 3줄 표시</text>
    <text x="20" y="76" fill="#cbd5e1" font-size="12.5">• 소음 환경 한국어 음성 질의응답</text>
    <text x="20" y="98" fill="#94a3b8" font-size="11.5">※ 로컬 엣지 스트리밍 연동</text>
  </g>
  <g transform="translate(342, 484)">
    <rect width="266" height="122" rx="10" fill="#091426" stroke="#10b981" stroke-opacity="0.5"/>
    <text x="20" y="30" fill="#34d399" font-size="14" font-weight="800">④ 5축 CNC · 레이저 CMM 직결</text>
    <text x="20" y="54" fill="#cbd5e1" font-size="12.5">• 가공 스핀들 부하 실시간 수집</text>
    <text x="20" y="76" fill="#cbd5e1" font-size="12.5">• 7대 핵심 치수 계측 → 여권 직결</text>
    <text x="20" y="98" fill="#6ee7b7" font-size="11.5">※ 수기 성적서 입력 오류 0%</text>
  </g>

  <!-- Core Promise Banner inside Factory -->
  <rect x="56" y="624" width="552" height="108" rx="12" fill="#051329" stroke="#38bdf8" stroke-opacity="0.6" stroke-width="1.5"/>
  <text x="332" y="660" fill="#38bdf8" font-size="13" font-weight="800" text-anchor="middle" letter-spacing="1">CORE SECURITY PRINCIPLE · 핵심 보안 원칙</text>
  <text x="332" y="694" fill="#ffffff" font-size="22" font-weight="800" text-anchor="middle">“도면은 공장 안에, 부품은 여권을 들고”</text>
  <text x="332" y="718" fill="#94a3b8" font-size="12.5" text-anchor="middle">원본 도면은 공장 밖으로 단 1바이트도 나가지 않으며, 오직 암호학적으로 봉인된 부품 여권만 반출됩니다</text>

  <!-- ==================== CENTER ZONE: DUAL UNIDIRECTIONAL GATE (단방향 이중 게이트) ==================== -->
  <rect x="652" y="114" width="320" height="640" rx="16" fill="#080e1a" stroke="#f59e0b" stroke-opacity="0.55" stroke-width="2"/>
  <rect x="652" y="114" width="320" height="52" rx="16" fill="#f59e0b" fill-opacity="0.16"/>
  <text x="812" y="146" fill="#fcd34d" font-size="17.5" font-weight="800" text-anchor="middle">⚡ 금빛·푸른 단방향 이중 게이트</text>

  <!-- GATE 1: BLUE INBOUND GATE (들어오는 길) -->
  <g transform="translate(670, 186)">
    <rect width="284" height="248" rx="12" fill="url(#gateBlue)" stroke="#38bdf8" stroke-width="2"/>
    <rect x="16" y="16" width="252" height="32" rx="6" fill="#0284c7"/>
    <text x="142" y="37" fill="#ffffff" font-size="14" font-weight="800" text-anchor="middle">◀ 푸른 게이트 (들어오는 길 · 반입)</text>

    <text x="142" y="74" fill="#7dd3fc" font-size="14" font-weight="800" text-anchor="middle">암호화 봉인 도면 단방향 반입</text>
    <line x1="254" y1="96" x2="30" y2="96" stroke="#38bdf8" stroke-width="4" marker-end="url(#arrBlue2)"/>

    <rect x="18" y="118" width="248" height="64" rx="8" fill="#041326" stroke="#38bdf8" stroke-opacity="0.45"/>
    <text x="142" y="142" fill="#ffffff" font-size="12.5" font-weight="700" text-anchor="middle">✓ 원청 공개키 암호화 도면 (.axvault)</text>
    <text x="142" y="164" fill="#6ee7b7" font-size="12.5" font-weight="700" text-anchor="middle">✓ 검역 통과 후 봉인 반입 (무결성 검증)</text>

    <rect x="18" y="192" width="248" height="40" rx="8" fill="#281019" stroke="#f43f5e" stroke-opacity="0.7"/>
    <text x="142" y="217" fill="#fda4af" font-size="12" font-weight="800" text-anchor="middle">🚫 역방향(공장→외부) 전송 물리적 차단</text>
  </g>

  <!-- GATE 2: GOLD OUTBOUND GATE (나가는 길) -->
  <g transform="translate(670, 454)">
    <rect width="284" height="280" rx="12" fill="url(#gateGold)" stroke="#f59e0b" stroke-width="2"/>
    <rect x="16" y="16" width="252" height="32" rx="6" fill="#d97706"/>
    <text x="142" y="37" fill="#ffffff" font-size="14" font-weight="800" text-anchor="middle">금빛 게이트 (나가는 길 · 반출) ▶</text>

    <text x="142" y="74" fill="#fcd34d" font-size="14" font-weight="800" text-anchor="middle">방산 부품 여권 전용 단방향 반출</text>
    <line x1="30" y1="96" x2="254" y2="96" stroke="#f59e0b" stroke-width="4" marker-end="url(#arrGold2)"/>

    <rect x="18" y="118" width="248" height="66" rx="8" fill="#181004" stroke="#f59e0b" stroke-opacity="0.5"/>
    <text x="142" y="142" fill="#fcd34d" font-size="12.5" font-weight="700" text-anchor="middle">✓ SHA-256 · Ed25519 부품 여권 (JSON/QR)</text>
    <text x="142" y="164" fill="#e2e8f0" font-size="12" text-anchor="middle">✓ 합격 판정 해시 · 세금계산서 메타데이터만 통과</text>

    <rect x="18" y="196" width="248" height="68" rx="8" fill="#281019" stroke="#f43f5e" stroke-opacity="0.8"/>
    <text x="142" y="220" fill="#fda4af" font-size="12.5" font-weight="800" text-anchor="middle">🚫 도면 원본 · 3D CAD · G-code 반출 불가</text>
    <text x="142" y="242" fill="#fecdd3" font-size="11.5" text-anchor="middle">하드웨어 화이트리스트 필터가 즉시 차단</text>
    <text x="142" y="258" fill="#fb7185" font-size="11" font-weight="700" text-anchor="middle">※ 두 길은 물리적으로 분리된 별개 장비</text>
  </g>

  <!-- ==================== RIGHT ZONE: OFFICE INTERNET ZONE (사무실 인터넷 구역) ==================== -->
  <rect x="992" y="114" width="576" height="640" rx="16" fill="url(#zoneAirgap)" stroke="#38bdf8" stroke-opacity="0.45" stroke-width="1.5"/>
  <rect x="992" y="114" width="576" height="52" rx="16" fill="#1e293b"/>
  <text x="1280" y="146" fill="#e2e8f0" font-size="18" font-weight="800" text-anchor="middle">🌐 사무실 인터넷 구역 &amp; 원청 연동 (Office Internet Zone)</text>

  <!-- Step 1: Receive -->
  <g transform="translate(1016, 186)">
    <rect width="528" height="120" rx="12" fill="#0b1629" stroke="#38bdf8" stroke-opacity="0.4"/>
    <rect x="18" y="18" width="44" height="44" rx="10" fill="#0284c7" fill-opacity="0.25" stroke="#38bdf8"/>
    <text x="40" y="46" fill="#38bdf8" font-size="18" font-weight="800" text-anchor="middle">01</text>
    <text x="78" y="36" fill="#ffffff" font-size="15.5" font-weight="800">원청 암호화 도면 수신 (수신 전용 PC)</text>
    <text x="78" y="62" fill="#cbd5e1" font-size="13">• 원청이 공장 서버 공개키로 봉인한 도면 파일 수신</text>
    <text x="78" y="84" fill="#7dd3fc" font-size="12.5" font-weight="700">• 사무실 PC에서는 열쇠(HSM 동글)가 없어 도면 열람 자체가 불가능</text>
    <text x="78" y="104" fill="#94a3b8" font-size="11.5">→ 혹시 사무실 PC가 해킹되더라도 암호문 상태이므로 기밀 유출 0%</text>
  </g>

  <!-- Step 2: Quarantine & Sealed Import -->
  <g transform="translate(1016, 322)">
    <rect width="528" height="120" rx="12" fill="#0b1629" stroke="#38bdf8" stroke-opacity="0.5"/>
    <rect x="18" y="18" width="44" height="44" rx="10" fill="#0284c7" fill-opacity="0.25" stroke="#38bdf8"/>
    <text x="40" y="46" fill="#38bdf8" font-size="18" font-weight="800" text-anchor="middle">02</text>
    <text x="78" y="36" fill="#38bdf8" font-size="15.5" font-weight="800">악성코드 검역 통과 후 봉인 반입 (푸른 게이트 통과)</text>
    <text x="78" y="62" fill="#cbd5e1" font-size="13">• 검역 전용 PC에서 전자서명 검증 및 악성코드 정밀 스캔 수행</text>
    <text x="78" y="84" fill="#e2e8f0" font-size="13">• 검증된 봉인 파일만 푸른 단방향 게이트를 통해 공장 서버로 전달</text>
    <text x="78" y="104" fill="#6ee7b7" font-size="12" font-weight="700">✓ 반입 완료 즉시 검역 PC 내 임시 사본 자동 영구 삭제</text>
  </g>

  <!-- Step 3: Outbound Passport -->
  <g transform="translate(1016, 458)">
    <rect width="528" height="132" rx="12" fill="#17120a" stroke="#f59e0b" stroke-opacity="0.55"/>
    <rect x="18" y="18" width="44" height="44" rx="10" fill="#d97706" fill-opacity="0.25" stroke="#f59e0b"/>
    <text x="40" y="46" fill="#fbbf24" font-size="18" font-weight="800" text-anchor="middle">03</text>
    <text x="78" y="36" fill="#fcd34d" font-size="15.5" font-weight="800">부품 여권 &amp; 세금계산서 반출 (금빛 게이트 통과)</text>
    <text x="78" y="62" fill="#cbd5e1" font-size="13">• 금빛 단방향 게이트를 통해 반출된 부품 여권(Part Passport) 수신</text>
    <text x="78" y="84" fill="#cbd5e1" font-size="13">• 실물 부품 출하와 동시에 원청 품질·보안팀으로 여권 및 세금계산서 발송</text>
    <text x="78" y="108" fill="#34d399" font-size="12.5" font-weight="800">✓ 원청은 도면 반출 없이도 “정확한 도면·공차대로 가공됨”을 1초 만에 검증</text>
  </g>

  <!-- Summary Comparison Box -->
  <g transform="translate(1016, 606)">
    <rect width="528" height="126" rx="12" fill="#06121e" stroke="#10b981" stroke-opacity="0.5"/>
    <text x="264" y="30" fill="#34d399" font-size="14" font-weight="800" text-anchor="middle">물리적 이중 게이트 보안 요약 (Defense Security Summary)</text>
    <line x1="24" y1="42" x2="504" y2="42" stroke="#10b981" stroke-opacity="0.3"/>
    <text x="32" y="68" fill="#7dd3fc" font-size="13" font-weight="700">• 푸른 반입 게이트:</text>
    <text x="165" y="68" fill="#e2e8f0" font-size="13">검역된 봉인 도면만 공장 안으로 진입 (역류 불가)</text>
    <text x="32" y="92" fill="#fcd34d" font-size="13" font-weight="700">• 금빛 반출 게이트:</text>
    <text x="165" y="92" fill="#e2e8f0" font-size="13">암호학 부품 여권(수 KB)만 외부로 반출 (도면 차단)</text>
    <text x="32" y="114" fill="#6ee7b7" font-size="12.5" font-weight="700">• 물리적 독립 설계:</text>
    <text x="165" y="114" fill="#94a3b8" font-size="12.5">반입 장비와 반출 장비는 회로가 분리된 서로 다른 하드웨어</text>
  </g>

  <!-- ==================== BOTTOM BAR ==================== -->
  <rect x="32" y="772" width="1536" height="62" rx="12" fill="#0b1528" stroke="#38bdf8" stroke-opacity="0.4"/>
  <text x="64" y="809" fill="#38bdf8" font-size="15" font-weight="800">핵심 요약</text>
  <line x1="145" y1="786" x2="145" y2="820" stroke="#38bdf8" stroke-opacity="0.4"/>
  <text x="168" y="809" fill="#ffffff" font-size="14.5" font-weight="700">◀ 들어오는 길: 봉인된 암호화 도면 (검역 통과 후 봉인 반입)</text>
  <text x="630" y="809" fill="#fcd34d" font-size="14.5" font-weight="700">▶ 나가는 길: 잠긴 부품 여권 (도면 원본 0 Byte)</text>
  <text x="1035" y="809" fill="#fda4af" font-size="14.5" font-weight="700">🚫 거꾸로는 절대 못 지나감 (물리적 단방향 분리)</text>

  <rect x="32" y="846" width="1536" height="44" rx="10" fill="#091222" stroke="#38bdf8" stroke-opacity="0.3"/>
  <text x="52" y="873" fill="#cbd5e1" font-size="12.5" font-weight="700">준거 기준: 국가정보원 망분리 보안 가이드라인 및 2026.12.10 시행 개정 방위산업기술 보호법 물리적·기술적 보호조치 완벽 충족</text>
  <text x="1548" y="873" fill="#94a3b8" font-size="12" font-weight="700" text-anchor="end">DOC: DUAL-AIRGAP-GATE-V2 · REV 2.0 · SHEET 2 / 4</text>
</svg>
